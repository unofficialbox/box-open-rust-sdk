[package]
name = "box-open-sdk"
version = "0.6.1"
edition = "2021"
description = "Box API client for Rust (open source, community, punk rock) — typed models, async managers, and a reqwest runtime with retry, backoff, and token refresh."
license = "MIT"
repository = "https://github.com/unofficialbox/box-open-rust-sdk"
homepage = "https://github.com/unofficialbox/box-open-rust-sdk"
documentation = "https://docs.rs/box-open-sdk"
readme = "README.md"
keywords = ["box", "box-api", "sdk", "api-client", "unofficial"]
categories = ["api-bindings", "web-programming"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2", "pem", "pkcs5"] }
sha2 = "0.10"
tokio = { version = "1", features = ["time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
