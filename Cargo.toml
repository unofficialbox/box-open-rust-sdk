[package]
name = "box-open-sdk"
version = "0.1.0"
edition = "2021"
description = "Generated Box API SDK for Rust (community, unofficial)."
license = "MIT"
repository = "https://github.com/unofficialbox/box-open-rust-sdk"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2", "pem", "pkcs5"] }
sha2 = "0.10"
tokio = { version = "1", features = ["time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
